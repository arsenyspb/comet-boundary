services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: boundary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  controller:
    image: hashicorp/boundary:0.21.0
    command: server -config /boundary/config.hcl
    restart: always
    cap_add:
      - IPC_LOCK
    volumes:
      - ./docker/boundary/controller.hcl:/boundary/config.hcl
    environment:
      BOUNDARY_POSTGRES_URL: "postgresql://postgres:postgres@postgres:5432/boundary?sslmode=disable"
    ports:
      - "9200:9200"
      - "9201:9201"
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9200 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    image: hashicorp/boundary:0.21.0
    command: server -config /boundary/config.hcl
    restart: always
    cap_add:
      - IPC_LOCK
    volumes:
      - ./docker/boundary/worker.hcl:/boundary/config.hcl
    ports:
      - "9202:9202"
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9202 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ssh-target:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      USER_PASSWORD: password
      USER_NAME: boundary-user
      PASSWORD_ACCESS: "true"
    ports:
      - "2222:2222"

  # Setup container to initialize Boundary
  setup:
    image: hashicorp/boundary:0.21.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for postgres..."
        until nc -z postgres 5432; do sleep 1; done
        echo "Initializing database..."
        boundary database init -skip-host-resources-creation -skip-target-creation -config /boundary/config.hcl || echo "Database already initialized"
        echo "Setup complete."
    volumes:
      - ./docker/boundary/controller.hcl:/boundary/config.hcl
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./server
    environment:
      BOUNDARY_ADDR: "http://controller:9200"
      BOUNDARY_AUTH_METHOD_ID: "${BOUNDARY_AUTH_METHOD_ID}"
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client/.env.local:/app/.env.local:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 5s
      timeout: 5s
      retries: 5
