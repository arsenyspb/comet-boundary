name: Release

on:
  release:
    types: [published]

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/comet-boundary:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/comet-boundary:latest

  publish-chart:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Helm
        uses: azure/setup-helm@v4
        
      - name: Log in to Helm registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
        
      - name: Package and push Helm chart
        run: |
          helm package charts/comet-boundary --version ${{ github.event.release.tag_name }}
          helm push comet-boundary-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
